[alembic]
script_location = alembic
prepend_sys_path = .

# A URL do banco NÃO fica aqui de propósito — env.py lê de
# app.core.config.get_settings(), a mesma fonte usada pela aplicação.
# Assim existe um único lugar (.env) pra configurar o banco, tanto
# pra rodar a API quanto pra rodar migrations.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
